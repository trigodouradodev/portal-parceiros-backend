name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    # `edited` dispara em mudança de título/descrição do PR, que não altera o
    # código — só o validate-pr precisa reagir a esse evento.
    if: github.event.action != 'edited'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          # pipefail é obrigatório: sem ele o status do pipeline seria o do
          # `tee` (sempre 0) e um teste quebrado passaria despercebido.
          set -o pipefail
          npm run test:cov -- \
            --ci \
            --coverageReporters=text-summary \
            --coveragePathIgnorePatterns='(\.spec\.ts|\.fixture\.ts)$' \
            2>&1 | tee test-output.txt

      # Roda mesmo com teste quebrado: aí o resumo traz o rastro da falha, que é
      # justamente quando o revisor mais precisa dele.
      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [ ! -f test-output.txt ]; then
            echo 'Testes não chegaram a rodar.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Testes e cobertura'
            echo ''
            echo '```'
            tail -n 25 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-pr:
    name: Validate PR title and description
    runs-on: ubuntu-latest

    steps:
      - name: Check title and description
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            const branch = context.payload.pull_request.head.ref;

            // Skip validation for fix/* and hotfix/* branches
            if (/^(fix|hotfix)\//.test(branch)) {
              console.log(`✅ Branch "${branch}" — validação de título/descrição ignorada.`);
              return;
            }

            const errors = [];

            // Validate title: must start with a Jira issue key followed by colon
            // Format: AUREA-220: Description...
            const titleRegex = /^[A-Z][A-Z0-9]+-\d+:/i;
            if (!titleRegex.test(title)) {
              errors.push('❌ **Título inválido**: o título deve começar com a chave do ticket Jira seguida de dois pontos.\n   Formato esperado: `AUREA-220: Descrição da tarefa`');
            }

            // Validate body: must contain a Jira link
            const jiraLinkRegex = /https:\/\/aureadev\.atlassian\.net\/browse\/[A-Z][A-Z0-9]+-\d+/i;
            if (!jiraLinkRegex.test(body)) {
              errors.push('❌ **Descrição inválida**: a descrição deve conter o link do ticket no Jira.\n   Exemplo: `https://aureadev.atlassian.net/browse/AUREA-220`');
            }

            if (errors.length > 0) {
              const message = [
                '## ❌ PR inválido',
                '',
                'As seguintes validações falharam:',
                '',
                ...errors,
                '',
                '---',
                '_Corrija o título e/ou a descrição e o check será revalidado automaticamente._',
              ].join('\n');

              core.setFailed(message);
            } else {
              console.log('✅ Título e descrição válidos.');
            }
